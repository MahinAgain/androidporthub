<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202429">
  <meta name="description" content="AndroPortHub — mobile gaming and port community.">
  <title>AndroPortHub</title>
  <style>
    :root { color-scheme: light; --page:#f3f4f6; --surface:#fff; --text:#24282e; --muted:#737982; --line:#e1e4e8; --nav:#292d33; --max:1120px; --accent:#e75b35; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--page); color:var(--text); font:15px/1.5 Arial,Helvetica,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .site-header { background:var(--surface); border-bottom:1px solid var(--line); }
    .header-inner { width:min(var(--max),calc(100% - 32px)); min-height:70px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:24px; font-weight:800; letter-spacing:-.7px; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:7px; background:var(--accent); color:white; }
    .header-note { color:var(--muted); font-size:13px; }
    .nav { background:var(--nav); color:white; }
    .nav-inner { width:min(var(--max),calc(100% - 32px)); min-height:44px; margin:auto; display:flex; overflow-x:auto; }
    .nav a { display:flex; align-items:center; padding:0 16px; font-size:13px; font-weight:700; white-space:nowrap; }
    .nav a:first-child { padding-left:0; padding-right:20px; }
    .nav a:hover { background:#3a3f47; }
    .wrap { width:min(var(--max),calc(100% - 32px)); margin:20px auto 0; }
    .cover { display:block; width:100%; height:auto; aspect-ratio:2048 / 682; object-fit:cover; border-radius:4px; background:#17191d; }
    .empty-content { min-height:220px; }
    .posts-link { margin:18px 0 0; padding:14px 16px; background:#fff; border:1px solid var(--line); border-radius:6px; }
    .posts-link a { color:var(--accent); font-weight:700; }
    footer { width:min(var(--max),calc(100% - 32px)); margin:32px auto 0; padding:18px 0 24px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    @media(max-width:600px) { .header-inner{min-height:62px}.brand{font-size:21px}.header-note{display:none}.nav a{padding:0 13px}.wrap{margin-top:12px}.cover{min-height:130px;object-fit:cover}.empty-content{min-height:180px} }
  </style>
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="./" aria-label="AndroPortHub home"><span class="brand-mark" aria-hidden="true">A</span><span>AndroPortHub</span></a>
    <span class="header-note">Mobile gaming portal</span>
  </div></header>
  <nav class="nav" aria-label="Main navigation"><div class="nav-inner">
    <a href="./">Home</a><a href="game-posts.html">Android</a><a href="game-posts.html">Games</a><a href="game-posts.html">Ports</a><a href="game-posts.html">Guides</a>
  </div></nav>
  <main class="wrap">
    <img class="cover" src="cover.png" alt="AndroPortHub gaming cover featuring fantasy parkour, military action, and street racing">
    <div class="posts-link">Want to browse game articles? <a href="game-posts.html">Visit Game Posts →</a></div>
    <div class="empty-content"></div>
  </main>
  <footer>© <span id="year"></span> AndroPortHub</footer>
  <script>document.getElementById("year").textContent=new Date().getFullYear();</script>
</body>
</html>
